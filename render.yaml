# Render Free only. Existing Neon database is supplied through protected env values.
# Does not create a database, disk, worker, cron service or paid resource.
services:
  - type: web
    name: mashrouak-api
    runtime: node
    repo: https://github.com/SaadSinan-dev/Mashrouak-website
    branch: main
    rootDir: .
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w @mashrouak/backend
    startCommand: npm run start -w @mashrouak/backend
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      - key: SITE_URL
        sync: false
      - key: PAGES_PROXY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: mashrouak
      - key: AI_PROVIDER
        value: none
      - key: CHAT_RETENTION_DAYS
        value: 90
