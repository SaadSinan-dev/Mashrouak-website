<!doctype html>
<html lang="en" dir="ltr" data-language="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102733" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="We design and develop websites, applications, and custom systems that help businesses reach customers and organize operations" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Mashrouak.net — Digital products for your business" />
    <meta property="og:description" content="Websites, applications, and digital systems shaped around real business needs" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/brand/instagram-avatar.svg" />
    <title>Mashrouak.net — Digital products for your business</title>
    <style>
      #app-loader { position:fixed; inset:0; z-index:9999; background:#F6F4EE; color:#142B3A; }
      .boot-header { box-sizing:border-box; height:84px; border-bottom:1px solid #d8e0dc; display:flex; align-items:center; padding-inline:max(24px,calc((100vw - 1240px)/2)); }
      .app-loader__logo { width:160px; height:52px; object-fit:contain; }
      .app-loader__label { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
      .app-loader__retry { min-height:44px; margin-inline:24px; padding:8px 20px; border:0; background:#0b625d; color:#fff; cursor:pointer; }
      :root[data-theme=dark] #app-loader { background:#102733; color:#eaf0ec; }
      :root[data-theme=dark] .boot-header { border-color:#eaf0ec26; }
      @media(max-width:1100px) { .boot-header { height:99px; } }
      @media(max-width:640px) { .boot-header { justify-content:center; } .app-loader__logo { width:146px; } }
    </style>
    <script>
      (() => {
        const stored = key => { try { return localStorage.getItem('mashrouak-' + key); } catch { return null; } };
        const query = new URLSearchParams(location.search);
        const preference = (key, allowed) => {
          const preview = query.has('preview') && query.get('preview_' + key);
          return allowed.includes(preview) ? preview : stored(key);
        };
        const language = preference('language', ['en', 'ar']);
        const saved = preference('theme', ['light', 'dark']);
        const theme = saved === 'light' || saved === 'dark' ? saved
          : window.matchMedia?.('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        const root = document.documentElement;
        if (language === 'ar') {
          root.lang = 'ar'; root.dir = 'rtl'; root.dataset.language = 'ar';
          document.title = 'مشروعك.net — حلول رقمية مصمّمة لأعمالك';
          document.querySelector('meta[name="description"]').content = 'مشروعك.net — استوديو للمنتجات الرقمية والحلول البرمجية نصمّم ونطوّر المواقع والمتاجر والتطبيقات والأنظمة المخصّصة للأعمال';
          document.querySelector('meta[property="og:locale"]').content = 'ar_AR';
          document.querySelector('meta[property="og:title"]').content = document.title;
          document.querySelector('meta[property="og:description"]').content = 'مواقع وتطبيقات وأنظمة رقمية تساعد مشروعك على العمل بصورة أوضح وأكثر ترابطاً';
        }
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#102733' : '#F6F4EE';
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">انتقل إلى المحتوى الرئيسي</a>
    <script>if (document.documentElement.lang === 'en') document.querySelector('.skip-link').textContent = 'Skip to main content';</script>
    <div id="root"></div>
    <div id="app-loader" role="status" aria-live="polite" aria-busy="true">
      <div class="boot-header"><img id="app-loader-logo" class="app-loader__logo" alt="" width="160" height="52" decoding="async" fetchpriority="high"/></div>
      <span id="app-loader-label" class="app-loader__label">جارٍ تحميل المحتوى</span>
      <button id="app-loader-retry" class="app-loader__retry" type="button" hidden>إعادة المحاولة</button>
    </div>
    <script>
      (() => {
        const root = document.documentElement;
        const language = root.lang === 'en' ? 'en' : 'ar';
        const theme = root.dataset.theme === 'dark' ? 'dark' : 'light';
        const logo = document.getElementById('app-loader-logo');
        const label = document.getElementById('app-loader-label');
        if (logo) {
          logo.src = language === 'en'
            ? (theme === 'dark' ? '/brand/logo-horizontal-en-ivory.png' : '/brand/logo-horizontal-en-colour.png')
            : (theme === 'dark' ? '/brand/logo-horizontal-ivory.svg' : '/brand/logo-horizontal-colour.svg');
          logo.alt = language === 'ar' ? 'مشروعك.net' : 'Mashrouak.net';
        }
        if (label) label.textContent = language === 'ar' ? 'جارٍ تجهيز الموقع' : 'Preparing your experience';
        const retry = document.getElementById('app-loader-retry');
        if (retry) {
          retry.textContent = language === 'ar' ? 'إعادة المحاولة' : 'Try again';
          retry.addEventListener('click', () => window.location.reload());
        }
        const showStartupError = () => {
          if (label) { label.textContent = language === 'ar' ? 'تعذّر تحميل الموقع' : 'The website could not be loaded'; label.style.cssText='position:static;display:block;width:auto;height:auto;padding:24px;clip:auto'; }
          if (retry) retry.hidden = false;
        };
        window.addEventListener('error', (event) => {
          const target = event.target;
          const moduleFailed = target instanceof HTMLScriptElement && target.type === 'module';
          const entryFailed = target === window && /\/src\/main\.tsx/.test(event.filename || '');
          if (moduleFailed || entryFailed) showStartupError();
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
